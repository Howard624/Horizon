name: Daily Howard AI Radar

on:
  schedule:
    # 21:30 UTC = 07:30 Australia/Brisbane (UTC+10, no daylight saving).
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare AI blogger config
        run: cp data/config.ai-blogger.json data/config.json

      - name: Set Brisbane report date
        run: echo "REPORT_DATE=$(TZ=Australia/Brisbane date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          HORIZON_REPORT_DATE: ${{ env.REPORT_DATE }}
        run: uv run horizon --hours 24

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: "Daily AI Radar: ${{ env.REPORT_DATE }}"
